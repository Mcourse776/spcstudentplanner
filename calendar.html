<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Calendar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }

    body {
      min-height: 100vh;
      background: #eef2f3;
      color: #1f2937;
    }

    .dashboard {
      display: flex;
      min-height: 100vh;
      position: relative;
    }

    .sidebar {
      width: 250px;
      background: linear-gradient(180deg, #0b7948 0%, #085f3a 100%);
      color: #fff;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 12px 0 28px rgba(11, 121, 72, 0.18);
      transition: transform 0.28s ease;
      transform: translateX(-100%);
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      z-index: 40;
    }

    .sidebar-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .back-btn {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.14);
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 8px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #fff;
    }

    .profile-text h2 {
      font-size: 1.05rem;
      margin-bottom: 4px;
      color: #fff;
    }

    .profile-text p {
      font-size: 0.8rem;
      opacity: 0.9;
    }

    .sidebar-menu {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #fff;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px 14px;
      font-weight: 600;
    }

    .nav-icon {
      width: 22px;
      text-align: center;
      font-size: 1.1rem;
    }

    .main-panel {
      flex: 1;
      min-height: 100vh;
      padding: 0 0 30px;
      margin-left: 0;
    }

    .topbar {
      background: linear-gradient(180deg, #0b7948 0%, #085f3a 100%);
      color: #fff;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      box-shadow: 0 4px 12px rgba(11, 121, 72, 0.15);
    }

    .left-controls {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .burger-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }

    .burger-btn span,
    .burger-btn span::before,
    .burger-btn span::after {
      content: "";
      display: block;
      position: relative;
      width: 18px;
      height: 2px;
      background: #fff;
      border-radius: 2px;
    }

    .burger-btn span::before { top: -6px; }
    .burger-btn span::after { top: 6px; }

    .page {
      padding: 24px;
      width: 100%;
    }

    .page-card {
      max-width: 1100px;
      margin: 0 auto;
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
      padding: 24px;
    }

    .calendar-wrap {
      width: 100%;
      height: 700px;
      border: 1px solid #dfeae3;
      border-radius: 18px;
      overflow: hidden;
      background: #fff;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    @media (max-width: 760px) {
      .sidebar {
        width: 220px;
      }

      .page {
        padding: 18px;
      }

      .calendar-wrap {
        height: 560px;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div></div>
        <button class="back-btn" id="backBtn" type="button" aria-label="Close sidebar">←</button>
      </div>

      <div class="profile">
        <div class="avatar">S</div>
        <div class="profile-text">
          <h2>Student 1</h2>
          <p>student1</p>
        </div>
      </div>

      <div class="sidebar-menu">
        <a class="sidebar-link" href="student.html"><span class="nav-icon">⌂</span>Home</a>
        <a class="sidebar-link active" href="calendar.html"><span class="nav-icon">🗓</span>Calendar</a>
        <a class="sidebar-link" href="#"><span class="nav-icon">⇪</span>My classes</a>
        <a class="sidebar-link" href="#"><span class="nav-icon">⚙</span>Settings</a>
      </div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <div class="left-controls">
          <button class="burger-btn" id="burgerBtn" type="button" aria-label="Toggle menu">
            <span></span>
          </button>
        </div>
      </header>

      <div class="page">
        <div class="page-card">
          <div class="calendar-wrap">
            <iframe id="googleCalendarFrame" src="https://calendar.google.com/calendar/embed?ctz=Asia%2FManila" title="Google Calendar"></iframe>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const burgerBtn = document.getElementById('burgerBtn');
    const backBtn = document.getElementById('backBtn');
    const sidebar = document.getElementById('sidebar');

    burgerBtn.addEventListener('click', () => {
      sidebar.style.transform = 'translateX(0)';
    });

    backBtn.addEventListener('click', () => {
      sidebar.style.transform = 'translateX(-100%)';
    });
  </script>
</body>
</html>
