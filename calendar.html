<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Calendar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }

    body {
      min-height: 100vh;
      background: #eef2f3;
      color: #1f2937;
    }

    a { text-decoration: none; }

    .dashboard {
      display: flex;
      min-height: 100vh;
      position: relative;
      background: #eef2f3;
    }

    .sidebar {
      width: 250px;
      background: linear-gradient(180deg, #0b7948 0%, #085f3a 100%);
      color: #fff;
      padding: 18px 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 12px 0 28px rgba(11, 121, 72, 0.18);
      transition: transform 0.28s ease;
      transform: translateX(-100%);
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      z-index: 40;
    }

    .sidebar.open { transform: translateX(0); }

    .sidebar-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .back-btn {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.14);
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 8px 18px;
      margin: 0 0 8px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #fff;
      font-size: 1.1rem;
    }

    .profile-text h2 {
      font-size: 1.05rem;
      margin-bottom: 4px;
      color: #fff;
    }

    .profile-text p {
      font-size: 0.8rem;
      opacity: 0.9;
    }

    .sidebar-menu {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }

    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px 14px;
      font-weight: 600;
      font-size: 1rem;
    }

    .sidebar-link.active {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.18);
    }

    .nav-icon {
      width: 22px;
      text-align: center;
      font-size: 1.1rem;
    }

    .main-panel {
      flex: 1;
      min-height: 100vh;
      padding: 0 0 30px;
      margin-left: 0;
    }

    .topbar {
      background: linear-gradient(180deg, #0b7948 0%, #085f3a 100%);
      color: #fff;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      box-shadow: 0 4px 12px rgba(11, 121, 72, 0.15);
    }

    .left-controls {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .topbar-logo {
      width: 54px;
      height: 54px;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 3px 10px rgba(5, 64, 38, 0.12));
    }

    .burger-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }

    .burger-btn span,
    .burger-btn span::before,
    .burger-btn span::after {
      content: "";
      display: block;
      position: relative;
      width: 18px;
      height: 2px;
      background: #fff;
      border-radius: 2px;
    }

    .burger-btn span::before { top: -6px; }
    .burger-btn span::after { top: 6px; }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logout-btn {
      background: #fff;
      color: #0b7948;
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: bold;
      text-decoration: none;
      display: inline-block;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .page {
      padding: 24px;
      width: 100%;
    }

    .page-card {
      max-width: 1100px;
      margin: 0 auto;
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
      padding: 24px;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
      padding: 8px 4px;
    }

    .eyebrow {
      font-size: 0.76rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .calendar-header h2 {
      font-size: clamp(1.5rem, 2.3vw, 2.2rem);
      color: #111827;
    }

    .calendar-layout {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(220px, 0.9fr);
      gap: 22px;
      align-items: start;
    }

    .calendar-grid-wrapper {
      border: 1px solid #dfeae3;
      border-radius: 18px;
      background: #fff;
      overflow: hidden;
    }

    .weekday-row,
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }

    .weekday-row {
      background: #f3f7f4;
      border-bottom: 1px solid #e5e7eb;
    }

    .weekday-row div {
      padding: 14px 8px;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 700;
      color: #4b5563;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .calendar-grid {
      min-height: 470px;
    }

    .day {
      min-height: 96px;
      border-right: 1px solid #eef2f3;
      border-bottom: 1px solid #eef2f3;
      background: #fff;
      padding: 10px 8px;
      position: relative;
    }

    .day:nth-child(7n) {
      border-right: none;
    }

    .day.empty {
      background: #fafafa;
    }

    .day-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-weight: 700;
      font-size: 0.84rem;
      color: #111827;
      margin-bottom: 8px;
    }

    .day.has-event .day-number {
      background: #dcfce7;
      color: #166534;
    }

    .day.today .day-number {
      background: #0b7948;
      color: #fff;
      box-shadow: 0 0 0 3px rgba(11, 121, 72, 0.12);
    }

    .event-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      display: block;
      margin-top: 6px;
    }

    .event-panel {
      background: #fff;
      border: 1px solid #dfeae3;
      border-radius: 18px;
      padding: 20px 18px;
    }

    .event-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .event-panel h3 {
      font-size: 1.1rem;
      color: #111827;
    }

    .event-panel button {
      border: none;
      background: #0b7948;
      color: #fff;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .picker-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .picker-overlay.show {
      display: flex;
    }

    .picker-card {
      width: min(420px, 100%);
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.2);
      padding: 20px;
    }

    .picker-card h4 {
      font-size: 1.15rem;
      margin-bottom: 18px;
      color: #111827;
    }

    .picker-field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }

    .picker-field label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #374151;
    }

    .picker-field input,
    .picker-field textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.92rem;
    }

    .picker-field textarea {
      min-height: 80px;
      resize: vertical;
    }

    .picker-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 12px;
    }

    .picker-actions button {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
    }

    .picker-actions .cancel-btn {
      background: #e5e7eb;
      color: #374151;
    }

    .picker-actions .save-btn {
      background: #0b7948;
      color: #fff;
    }

    .event-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 32px;
    }

    .event-stamp {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      width: 100%;
      background: linear-gradient(180deg, #f0fdf4 0%, #ecfdf5 100%);
      border: 1px solid #a7f3d0;
      border-radius: 12px;
      color: #14532d;
      padding: 10px 12px;
      text-align: left;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .event-stamp:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 12px rgba(22, 101, 52, 0.1);
    }

    .event-date {
      display: inline-block;
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .event-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #14532d;
      line-height: 1.35;
    }

    .event-empty {
      color: #6b7280;
      font-size: 0.9rem;
      border: 1px dashed #cbd5e1;
      border-radius: 10px;
      padding: 12px 10px;
      background: #f8fafc;
      width: 100%;
    }

    @media (max-width: 760px) {
      .sidebar {
        width: 220px;
      }

      .page {
        padding: 18px;
      }

      .calendar-layout {
        grid-template-columns: 1fr;
      }

      .calendar-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .day {
        min-height: 82px;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div></div>
        <button class="back-btn" id="backBtn" type="button" aria-label="Close sidebar">←</button>
      </div>

      <div class="profile">
        <div class="avatar">S</div>
        <div class="profile-text">
          <h2>Student 1</h2>
          <p>student1</p>
        </div>
      </div>

      <div class="sidebar-menu">
        <a class="sidebar-link" href="student.html"><span class="nav-icon">⌂</span>Home</a>
        <a class="sidebar-link active" href="calendar.html"><span class="nav-icon">🗓</span>Calendar</a>
        <a class="sidebar-link" href="student-chat.html"><span class="nav-icon">⇪</span>Chats</a>
        <a class="sidebar-link" href="#"><span class="nav-icon">⚙</span>Settings</a>
      </div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <div class="left-controls">
          <button class="burger-btn" id="burgerBtn" type="button" aria-label="Toggle menu">
            <span></span>
          </button>
          <img src="logo.png" alt="Logo" class="topbar-logo">
        </div>
        <div class="topbar-actions">
          <a class="logout-btn" href="index.html">Log Out</a>
        </div>
      </header>

      <div class="page">
        <div class="page-card">
          <div class="calendar-header">
            <div>
              <p class="eyebrow">Academic Schedule</p>
              <h2 id="monthLabel">October 2026</h2>
            </div>
          </div>

          <div class="calendar-layout">
            <div class="calendar-grid-wrapper">
              <div class="weekday-row" aria-label="Weekdays">
                <div>Sun</div>
                <div>Mon</div>
                <div>Tue</div>
                <div>Wed</div>
                <div>Thu</div>
                <div>Fri</div>
                <div>Sat</div>
              </div>
              <div class="calendar-grid" id="calendarGrid" aria-live="polite"></div>
            </div>

            <aside class="event-panel" aria-label="Editable important dates">
              <div class="event-panel-header">
                <h3>Important Dates</h3>
                <button type="button" id="addDatesBtn">Add</button>
              </div>

              <div id="eventList" class="event-list" aria-live="polite"></div>
            </aside>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="picker-overlay" id="pickerOverlay" aria-hidden="true">
    <div class="picker-card" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
      <h4 id="pickerTitle">Add Important Date</h4>

      <div class="picker-field">
        <label for="pickerDate">Date</label>
        <input id="pickerDate" type="date" aria-label="Choose a date" />
      </div>

      <div class="picker-field">
        <label for="pickerText">Description</label>
        <textarea id="pickerText" placeholder="Enter a short event description"></textarea>
      </div>

      <div class="picker-actions">
        <button type="button" class="cancel-btn" id="cancelPickerBtn">Cancel</button>
        <button type="button" class="save-btn" id="savePickerBtn">Save</button>
      </div>
    </div>
  </div>

  <script>
    const BrgerBtn = document.getElementById('burgerBtn');
    const backBtn = document.getElementById('backBtn');
    const sidebar = document.getElementById('sidebar');
    const calendarGrid = document.getElementById('calendarGrid');
    const monthLabel = document.getElementById('monthLabel');
    const eventList = document.getElementById('eventList');
    const addDatesBtn = document.getElementById('addDatesBtn');
    const pickerOverlay = document.getElementById('pickerOverlay');
    const pickerDate = document.getElementById('pickerDate');
    const pickerText = document.getElementById('pickerText');
    const cancelPickerBtn = document.getElementById('cancelPickerBtn');
    const savePickerBtn = document.getElementById('savePickerBtn');

    const year = 2026;
    const month = 9;
    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    const startDay = firstDay.getDay();
    const totalDays = lastDay.getDate();
    const today = new Date();
    const savedEvents = [];

    burgerBtn.addEventListener('click', () => {
      sidebar.classList.add('open');
    });

    backBtn.addEventListener('click', () => {
      sidebar.classList.remove('open');
    });

    function formatStamp(dateValue) {
      if (!dateValue) return '';
      const date = new Date(dateValue + 'T00:00:00');
      return date.toLocaleDateString('en-US', {
        month: 'short',
        day: 'numeric'
      });
    }

    function renderCalendar() {
      calendarGrid.innerHTML = '';

      for (let i = 0; i < 42; i++) {
        const day = document.createElement('div');
        day.className = 'day';

        const dayNumber = i - startDay + 1;

        if (dayNumber <= 0 || dayNumber > totalDays) {
          day.classList.add('empty');
          day.innerHTML = '<span class="day-number">&nbsp;</span>';
          calendarGrid.appendChild(day);
          continue;
        }

        const number = document.createElement('span');
        number.className = 'day-number';
        number.textContent = dayNumber;

        const matchingEvent = savedEvents.find((entry) => {
          const eventDate = new Date(entry.date + 'T00:00:00');
          return eventDate.getFullYear() === year
            && eventDate.getMonth() === month
            && eventDate.getDate() === dayNumber;
        });

        if (matchingEvent) {
          day.classList.add('has-event');
        }

        if (
          dayNumber === today.getDate() &&
          today.getMonth() === month &&
          today.getFullYear() === year
        ) {
          day.classList.add('today');
        }

        day.appendChild(number);

        if (matchingEvent) {
          const dot = document.createElement('span');
          dot.className = 'event-dot';
          dot.setAttribute('aria-label', 'Event scheduled');
          dot.title = matchingEvent.description || 'Important date';
          day.appendChild(dot);
        }

        calendarGrid.appendChild(day);
      }
    }

    function renderEvents() {
      eventList.innerHTML = '';

      if (savedEvents.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'event-empty';
        empty.textContent = 'No important dates yet. Add your next event here.';
        eventList.appendChild(empty);
        return;
      }

      savedEvents.forEach((entry) => {
        const stamp = document.createElement('button');
        stamp.type = 'button';
        stamp.className = 'event-stamp';

        const date = document.createElement('span');
        date.className = 'event-date';
        date.textContent = formatStamp(entry.date);

        const title = document.createElement('span');
        title.className = 'event-title';
        title.textContent = entry.description || 'Important date';

        stamp.appendChild(date);
        stamp.appendChild(title);

        stamp.setAttribute('aria-label', `${formatStamp(entry.date)}: ${entry.description || 'Important date'}`);
        stamp.title = entry.description || 'Important date';
        eventList.appendChild(stamp);
      });
    }

    function openPicker() {
      pickerOverlay.classList.add('show');
      pickerOverlay.setAttribute('aria-hidden', 'false');
      pickerDate.focus();
    }

    function closePicker() {
      pickerOverlay.classList.remove('show');
      pickerOverlay.setAttribute('aria-hidden', 'true');
      pickerDate.value = '';
      pickerText.value = '';
    }

    addDatesBtn.addEventListener('click', openPicker);
    cancelPickerBtn.addEventListener('click', closePicker);
    pickerOverlay.addEventListener('click', (event) => {
      if (event.target === pickerOverlay) closePicker();
    });

    savePickerBtn.addEventListener('click', () => {
      const dateValue = pickerDate.value;
      const description = pickerText.value.trim();

      if (!dateValue) {
        pickerDate.focus();
        return;
      }

      savedEvents.push({
        date: dateValue,
        description: description || 'Important date'
      });

      renderCalendar();
      renderEvents();
      closePicker();
    });

    monthLabel.textContent = firstDay.toLocaleString('en-US', {
      month: 'long',
      year: 'numeric'
    });

    renderCalendar();
    renderEvents();
  </script>
</body>
</html>
