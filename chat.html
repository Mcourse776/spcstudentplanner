<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Chats</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }

    body {
      min-height: 100vh;
      background: #eef2f3;
      color: #1f2937;
    }

    a { text-decoration: none; }

    .dashboard {
      display: flex;
      min-height: 100vh;
      position: relative;
      background: #eef2f3;
    }

    .sidebar {
      width: 250px;
      background: linear-gradient(180deg, #0b7948 0%, #085f3a 100%);
      color: #fff;
      padding: 18px 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 12px 0 28px rgba(11, 121, 72, 0.18);
      transition: transform 0.28s ease;
      transform: translateX(-100%);
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      z-index: 40;
    }

    .sidebar.open { transform: translateX(0); }

    .sidebar-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .back-btn {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.14);
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 8px 18px;
      margin: 0 0 8px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #fff;
      font-size: 1.1rem;
    }

    .profile-text h2 {
      font-size: 1.05rem;
      margin-bottom: 4px;
      color: #fff;
    }

    .profile-text p {
      font-size: 0.8rem;
      opacity: 0.9;
    }

    .sidebar-menu {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }

    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px 14px;
      font-weight: 600;
      font-size: 1rem;
    }

    .sidebar-link.active {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.18);
    }

    .nav-icon {
      width: 22px;
      text-align: center;
      font-size: 1.1rem;
    }

    .main-panel {
      flex: 1;
      min-height: 100vh;
      margin-left: 0;
      padding: 0 0 30px;
    }

    .topbar {
      background: linear-gradient(180deg, #0b7948 0%, #085f3a 100%);
      color: #fff;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      box-shadow: 0 4px 12px rgba(11, 121, 72, 0.15);
    }

    .left-controls {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .topbar-logo {
      width: 54px;
      height: 54px;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 3px 10px rgba(5, 64, 38, 0.12));
    }

    .burger-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }

    .burger-btn span,
    .burger-btn span::before,
    .burger-btn span::after {
      content: "";
      display: block;
      position: relative;
      width: 18px;
      height: 2px;
      background: #fff;
      border-radius: 2px;
    }

    .burger-btn span::before { top: -6px; }
    .burger-btn span::after { top: 6px; }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logout-btn {
      background: #fff;
      color: #0b7948;
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: bold;
      text-decoration: none;
      display: inline-block;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .page {
      max-width: 1220px;
      margin: 26px auto 0;
      padding: 0 20px 30px;
    }

    .messenger-shell {
      width: 100%;
      height: calc(100vh - 150px);
      min-height: 680px;
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
      overflow: hidden;
      display: grid;
      grid-template-columns: 360px 1fr;
      border: 1px solid #dfeae3;
    }

    .sidebar-list {
      background: #f6f7f9;
      border-right: 1px solid #e5e7eb;
      padding: 18px 14px 0;
      display: flex;
      flex-direction: column;
    }

    .chat-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 8px 18px;
      font-weight: 700;
      color: #111827;
    }

    .chat-topbar h1 {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .menu-dots {
      font-size: 1.4rem;
      color: #374151;
      line-height: 1;
      cursor: pointer;
    }

    .chat-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 8px 14px;
    }

    .chat-header-row h2 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #111827;
    }

    .filter {
      font-size: 0.95rem;
      font-weight: 600;
      color: #111827;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .contact-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      padding: 0 6px 10px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 10px;
      border-radius: 16px;
      cursor: pointer;
      transition: 0.2s ease;
      background: transparent;
    }

    .contact-item.active {
      background: #eef5ff;
    }

    .contact-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.88rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #8c9eff, #5d7cfe);
      flex-shrink: 0;
    }

    .contact-item:nth-child(2n) .contact-avatar {
      background: linear-gradient(135deg, #f7b267, #f4845f);
    }

    .contact-item:nth-child(3n) .contact-avatar {
      background: linear-gradient(135deg, #63d2a8, #3bb273);
    }

    .contact-main {
      flex: 1;
      min-width: 0;
    }

    .contact-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }

    .contact-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: #111827;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .contact-time {
      color: #6b7280;
      font-size: 0.72rem;
      white-space: nowrap;
    }

    .contact-preview {
      color: #6b7280;
      font-size: 0.82rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conversation-panel {
      display: flex;
      flex-direction: column;
      background: #f5f7fa;
    }

    .conversation-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f5f7fa;
      padding: 18px 20px 12px;
      border-bottom: 1px solid #e5e7eb;
    }

    .chat-user {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-user .contact-avatar {
      width: 38px;
      height: 38px;
      font-size: 0.8rem;
    }

    .chat-user h3 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #111827;
    }

    .online-pill {
      color: #1f9d55;
      font-size: 0.72rem;
      font-weight: 700;
      margin-top: 2px;
    }

    .conversation-body {
      flex: 1;
      padding: 18px 22px 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
      background: #f1f3f6;
    }

    .message-row {
      display: flex;
      width: 100%;
    }

    .message-row.outgoing {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 68%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.5;
      font-size: 0.95rem;
      word-wrap: break-word;
    }

    .bubble.incoming {
      background: #dfe8f9;
      color: #111827;
      border-top-left-radius: 6px;
    }

    .bubble.outgoing {
      background: #3d8bfd;
      color: #fff;
      border-top-right-radius: 6px;
    }

    .bubble small {
      display: block;
      margin-top: 8px;
      opacity: 0.8;
      font-size: 0.68rem;
    }

    .composer {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 18px 20px 22px;
      background: #f5f7fa;
      border-top: 1px solid #e5e7eb;
    }

    .composer.visible {
      display: flex;
    }

    .plus-btn {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: #1e88ff;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .composer input {
      flex: 1;
      border: 1px solid #dfe3ea;
      border-radius: 999px;
      padding: 14px 18px;
      font-size: 0.96rem;
      background: #fff;
      outline: none;
    }

    .composer input:focus {
      border-color: #4c8bf5;
      box-shadow: 0 0 0 3px rgba(76, 139, 245, 0.12);
    }

    .tool-btn {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: #e6edf8;
      color: #2d3748;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #6b7280;
      font-style: italic;
      text-align: center;
      padding: 30px;
    }

    @media (max-width: 920px) {
      .messenger-shell {
        grid-template-columns: 1fr;
      }

      .sidebar-list {
        border-right: none;
        border-bottom: 1px solid #e5e7eb;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar" id="teacherSidebar">
      <div class="sidebar-top">
        <div></div>
        <button class="back-btn" id="teacherBackBtn" aria-label="Close sidebar">←</button>
      </div>

      <div class="profile">
        <div class="avatar">T</div>
        <div class="profile-text">
          <h2>Teacher 1</h2>
          <p>teacher1</p>
        </div>
      </div>

      <div class="sidebar-menu">
        <a class="sidebar-link" href="#classList">Classes</a>
        <a class="sidebar-link" href="chat.html">Chat</a>
      </div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <div class="left-controls">
          <button class="burger-btn" id="teacherBurgerBtn" aria-label="Toggle sidebar">
            <span></span>
          </button>
          <img src="logo.png" alt="Logo" class="topbar-logo">
        </div>
        <div class="topbar-actions">
          <a class="logout-btn" href="index.html">Log Out</a>
        </div>
      </header>

      <div class="page">
        <div class="messenger-shell">
          <aside class="sidebar-list">
            <div class="chat-topbar">
              <h1>Messenger</h1>
              <div class="menu-dots">•••</div>
            </div>

            <div class="chat-header-row">
              <h2>Class chats</h2>
              <div class="filter">Newest <span>⌄</span></div>
            </div>

            <ul class="contact-list" id="contactList"></ul>
          </aside>

          <section class="conversation-panel">
            <div class="conversation-header">
              <div class="chat-user">
                <div class="contact-avatar" id="activeAvatar">C</div>
                <div>
                  <h3 id="activeName">Class</h3>
                  <div class="online-pill">Active now</div>
                </div>
              </div>
            </div>

            <div class="conversation-body" id="conversationBody">
              <div class="empty-state">Select a class conversation to open the messages.</div>
            </div>

            <form class="composer" id="composerForm">
              <button class="plus-btn" type="button" aria-label="Add">+</button>
              <input type="text" id="messageInput" placeholder="Type something here..." maxlength="200" required>
              <button class="tool-btn" type="button" aria-label="emoji">☺</button>
              <button class="tool-btn" type="button" aria-label="send image">📎</button>
            </form>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script>
    const CHAT_KEY = 'class_chat_messages';
    const STORAGE_KEY = 'teacher_classes';
    const sidebar = document.getElementById('sidebar');
    const burgerBtn = document.getElementById('burgerBtn');
    const backBtn = document.getElementById('backBtn');
    const contactList = document.getElementById('contactList');
    const conversationBody = document.getElementById('conversationBody');
    const activeName = document.getElementById('activeName');
    const activeAvatar = document.getElementById('activeAvatar');
    const composerForm = document.getElementById('composerForm');
    const messageInput = document.getElementById('messageInput');

    let activeCode = null;

    function getClasses() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function getChats() {
      try {
        return JSON.parse(localStorage.getItem(CHAT_KEY)) || {};
      } catch {
        return {};
      }
    }

    function saveChats(chats) {
      localStorage.setItem(CHAT_KEY, JSON.stringify(chats));
    }

    function getInitials(name) {
      return name
        .split(' ')
        .map(part => part[0])
        .join('')
        .slice(0, 2)
        .toUpperCase();
    }

    function renderContacts() {
      const classes = getClasses();

      if (!classes.length) {
        contactList.innerHTML = '<li class="empty-state">Create a class to begin chatting.</li>';
        conversationBody.innerHTML = '<div class="empty-state">Select a class conversation to open the messages.</div>';
        activeName.textContent = 'Class';
        activeAvatar.textContent = 'C';
        activeCode = null;
        composerForm.classList.remove('visible');
        return;
      }

      const chats = getChats();
      const items = classes.map(item => {
        const messages = chats[item.code] || [];
        const lastMessage = messages[messages.length - 1];
        return {
          code: item.code,
          name: item.name,
          preview: lastMessage ? lastMessage.text : 'No messages yet',
          time: lastMessage ? lastMessage.time : ''
        };
      });

      if (!activeCode || !items.some(item => item.code === activeCode)) {
        activeCode = items[0].code;
      }

      contactList.innerHTML = items.map(item => `
        <li class="contact-item ${item.code === activeCode ? 'active' : ''}" data-code="${item.code}">
          <div class="contact-avatar">${getInitials(item.name)}</div>
          <div class="contact-main">
            <div class="contact-row">
              <span class="contact-name">${item.name}</span>
              <span class="contact-time">${item.time || ''}</span>
            </div>
            <div class="contact-preview">${item.preview}</div>
          </div>
        </li>
      `).join('');

      document.querySelectorAll('.contact-item').forEach(item => {
        item.addEventListener('click', () => {
          activeCode = item.dataset.code;
          renderContacts();
        });
      });

      renderConversation();
    }

    function renderConversation() {
      if (!activeCode) {
        conversationBody.innerHTML = '<div class="empty-state">Select a class conversation to open the messages.</div>';
        composerForm.classList.remove('visible');
        return;
      }

      const classItem = getClasses().find(item => item.code === activeCode);
      const chats = getChats();
      const messages = chats[activeCode] || [];
      const className = classItem ? classItem.name : 'Class';

      activeName.textContent = className;
      activeAvatar.textContent = getInitials(className);
      composerForm.classList.add('visible');

      if (!messages.length) {
        conversationBody.innerHTML = '<div class="empty-state">No messages in this class yet.</div>';
        return;
      }

      conversationBody.innerHTML = messages.map(message => `
        <div class="message-row ${message.sender === 'teacher' ? 'outgoing' : ''}">
          <div class="bubble ${message.sender === 'teacher' ? 'outgoing' : 'incoming'}">
            ${message.text}
            <small>${message.sender === 'teacher' ? 'Teacher' : 'Student'} • ${message.time}</small>
          </div>
        </div>
      `).join('');

      conversationBody.scrollTop = conversationBody.scrollHeight;
    }

    composerForm.addEventListener('submit', function (event) {
      event.preventDefault();
      if (!activeCode) return;

      const text = messageInput.value.trim();
      if (!text) return;

      const chats = getChats();
      const messages = chats[activeCode] || [];
      messages.push({
        sender: 'teacher',
        text,
        time: new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
      });

      chats[activeCode] = messages;
      saveChats(chats);
      messageInput.value = '';
      renderContacts();
    });

    burgerBtn.addEventListener('click', () => {
      sidebar.classList.add('open');
    });

    backBtn.addEventListener('click', () => {
      sidebar.classList.remove('open');
    });

    window.addEventListener('storage', function (event) {
      if (event.key === CHAT_KEY || event.key === STORAGE_KEY) {
        renderContacts();
      }
    });

    renderContacts();
  </script>
</body>
</html>
