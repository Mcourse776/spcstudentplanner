
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Portal</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background:
        linear-gradient(rgba(5, 15, 30, 0.55),
                        rgba(5, 15, 30, 0.75)),
        url("https://assets.zyrosite.com/cdn-cgi/image/format=auto,w=1920,fit=crop/dOqNygBLv4fZ2kMW/spc-1-YD0v6bzGXvh40ZqZ.png")
        center / cover no-repeat fixed;
    }

    .login-card {
      width: 100%;
      max-width: 390px;
      padding: 38px 32px;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 18px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
      animation: appear 0.6s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      text-align: center;
      font-size: 30px;
      margin-bottom: 12px;
    }

    h1 {
      text-align: center;
      font-size: 27px;
      color: #172b4d;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
      background: white;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .password-wrap {
      display: flex;
      align-items: center;
      position: relative;
    }

    .password-wrap input {
      padding-right: 65px;
    }

    .toggle {
      position: absolute;
      right: 12px;
      border: none;
      background: none;
      color: #2563eb;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: 4px 0 23px;
      font-size: 13px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: normal;
      margin: 0;
    }

    .remember input {
      width: auto;
    }

    a {
      color: #2563eb;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .login-button {
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .login-button:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .message {
      margin-top: 15px;
      font-size: 13px;
      text-align: center;
      color: #b91c1c;
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      color: #6b7280;
    }

    @media (max-width: 420px) {
      .login-card {
        padding: 30px 22px;
      }
    }
  </style>
</head>

<body>
  <main class="login-card">
    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in to continue to your account</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username or Email<label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Enter your username"
          autocomplete="username"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
          <button class="toggle" type="button"
                  id="togglePassword">SHOW</button>
        </div>
      </div>

      <div class="options">
        <label class="remember">
          <input type="checkbox" id="remember">
          Remember me
        </label>
        <a href="#" id="forgotLink">Forgot password?</a>
      </div>

      <button type="submit" class="login-button">
        Sign In
      </button>

      <p class="message" id="message" role="status"
         aria-live="polite"></p>
    </form>

    <div class="footer">
      <p>&copy; 2026 grupo uno. All rights reserved.</p>
    </div>
  </main>

  <script>
    const password = document.getElementById("password");
    const toggle = document.getElementById("togglePassword");
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    const currentRole = sessionStorage.getItem("authRole");
    if (currentRole === "teacher") {
      window.location.href = "teacher.html";
      throw new Error("Redirecting to teacher dashboard.");
    }
    if (currentRole === "student") {
      window.location.href = "student.html";
      throw new Error("Redirecting to student dashboard.");
    }

    toggle.addEventListener("click", function () {
      const showing = password.type === "password";
      password.type = showing ? "text" : "password";
      toggle.textContent = showing ? "HIDE" : "SHOW";
    });

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const username = document.getElementById("username").value.trim();
      const enteredPassword = password.value.trim();

      if (!username || !enteredPassword) {
        message.style.color = "#b91c1c";
        message.textContent = "Please complete all fields.";
        return;
      }

      const validCredentials = {
        [atob("c3R1ZGVudDE=")]: atob("MTIzNDU2Nzg="),
        [atob("dGVhY2hlcjE=")]: atob("ODc2NTQzMjE=")
      };

      if (validCredentials[username] === undefined) {
        message.style.color = "#b91c1c";
        message.textContent = "Invalid username or password.";
        return;
      }

      if (validCredentials[username] !== enteredPassword) {
        message.style.color = "#b91c1c";
        message.textContent = "Invalid username or password.";
        return;
      }

      const userRole = username === atob("dGVhY2hlcjE=") ? "teacher" : "student";
      sessionStorage.setItem("authUser", username);
      sessionStorage.setItem("authRole", userRole);

      if (userRole === "teacher") {
        window.location.href = "teacher.html";
      } else {
        window.location.href = "student.html";
      }
    });

    document.getElementById("forgotLink")
      .addEventListener("click", function (event) {
        event.preventDefault();
        message.style.color = "#2563eb";
        message.textContent =
          "Please contact your administrator.";
      });
  </script>
</body>
</html>
