<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Chats</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }

    body {
      min-height: 100vh;
      background: #eef2f3;
      color: #1f2937;
    }

    a { text-decoration: none; }

    .dashboard {
      min-height: 100vh;
      display: flex;
      background: #eef2f3;
      position: relative;
    }

    .sidebar {
      width: 250px;
      background: linear-gradient(180deg, #0b7948 0%, #085f3a 100%);
      color: #fff;
      padding: 18px 16px 18px;
      transition: transform 0.28s ease;
      transform: translateX(-100%);
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 12px 0 28px rgba(11, 121, 72, 0.18);
    }

    .sidebar.open { transform: translateX(0); }

    .sidebar-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .back-btn {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.14);
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 8px 18px;
      margin: 0 0 8px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      color: #fff;
    }

    .profile-text h2 {
      font-size: 1.05rem;
      margin-bottom: 4px;
      color: #fff;
    }

    .profile-text p {
      font-size: 0.8rem;
      opacity: 0.9;
    }

    .sidebar-menu {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }

    .sidebar-link {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      color: #fff;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px 14px;
      font-weight: 600;
      font-size: 1rem;
      text-align: left;
    }

    .sidebar-link.active {
      background: rgba(255,255,255,0.18);
      border-color: rgba(255,255,255,0.3);
      color: #fff;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 0 18px rgba(255,255,255,0.18);
    }

    .nav-icon {
      width: 22px;
      text-align: center;
      font-size: 1.1rem;
      display: inline-block;
      line-height: 1;
    }

    .main-panel {
      flex: 1;
      min-height: 100vh;
      margin-left: 0;
      padding: 0 0 38px;
    }

    .topbar {
      background: linear-gradient(180deg, #0b7948 0%, #085f3a 100%);
      color: #fff;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 4px 12px rgba(11, 121, 72, 0.15);
    }

    .left-controls {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .topbar-logo {
      width: 54px;
      height: 54px;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 3px 10px rgba(5, 64, 38, 0.12));
    }

    .burger-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }

    .burger-btn span,
    .burger-btn span::before,
    .burger-btn span::after {
      content: "";
      display: block;
      width: 18px;
      height: 2px;
      background: #fff;
      border-radius: 2px;
      position: relative;
    }

    .burger-btn span::before { top: -6px; }
    .burger-btn span::after { top: 6px; }

    .topbar-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
    }

    .brand-mark {
      width: 18px;
      height: 18px;
      background: linear-gradient(180deg, #4bab65 0%, #0b7948 100%);
      border-radius: 4px;
      display: inline-block;
      position: relative;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.4);
    }

    .brand-mark::before {
      content: "";
      position: absolute;
      inset: 4px;
      background: rgba(255,255,255,0.7);
      border-radius: 2px;
    }

    .logout-btn {
      background: #fff;
      color: #0b7948;
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: bold;
      text-decoration: none;
      display: inline-block;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .page {
      max-width: 1180px;
      width: 100%;
      margin: 18px auto 0;
      padding: 0 14px 40px;
    }

    .messenger-panel {
      background: #f5f5f5;
      border-radius: 18px;
      box-shadow: 0 10px 28px rgba(17, 24, 39, 0.06);
      overflow: hidden;
      border: 1px solid rgba(17, 24, 39, 0.04);
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px 12px;
      background: #f5f5f5;
      border-bottom: 1px solid #e5e7eb;
    }

    .chat-header h1 {
      font-size: 1.08rem;
      font-weight: 700;
      color: #111827;
    }

    .contact-list {
      list-style: none;
      padding: 4px 10px 10px;
      background: #f5f5f5;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 10px;
      border-radius: 14px;
      transition: 0.2s ease;
      background: transparent;
      color: inherit;
      text-decoration: none;
    }

    .contact-item:hover {
      background: #edf3ff;
    }

    .contact-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #fff;
      font-size: 0.9rem;
      flex-shrink: 0;
      background: linear-gradient(135deg, #7a6af7, #5d7cfe);
    }

    .contact-item:nth-child(2n) .contact-avatar {
      background: linear-gradient(135deg, #ff885e, #f35f61);
    }

    .contact-item:nth-child(3n) .contact-avatar {
      background: linear-gradient(135deg, #3ecf9c, #22b07d);
    }

    .contact-main {
      flex: 1;
      min-width: 0;
    }

    .contact-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }

    .contact-name {
      font-size: 1rem;
      font-weight: 700;
      color: #111827;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .contact-time {
      font-size: 0.72rem;
      color: #6b7280;
      white-space: nowrap;
    }

    .contact-preview {
      font-size: 0.88rem;
      color: #6b7280;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .empty-state {
      padding: 20px 12px;
      color: #6b7280;
      text-align: center;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar" id="studentSidebar">
      <div class="sidebar-top">
        <div></div>
        <button class="back-btn" id="studentBackBtn" aria-label="Close sidebar">←</button>
      </div>

      <div class="profile">
        <div class="avatar">S</div>
        <div class="profile-text">
          <h2>Student 1</h2>
          <p>student1</p>
        </div>
      </div>

      <div class="sidebar-menu">
        <a class="sidebar-link" href="student.html" id="homeNav"><span class="nav-icon">⌂</span>Home</a>
        <a class="sidebar-link" href="calendar.html"><span class="nav-icon">🗓</span>Calendar</a>
        <a class="sidebar-link active" href="student-chat.html" id="chatNav"><span class="nav-icon">⇪</span>Chats</a>
        <a class="sidebar-link" href="#"><span class="nav-icon">⚙</span>Settings</a>
      </div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <div class="left-controls">
          <button class="burger-btn" id="studentBurgerBtn" aria-label="Toggle sidebar">
            <span></span>
          </button>
          <img src="logo.png" alt="Logo" class="topbar-logo">
          <div class="topbar-title">
          </div>
        </div>
      </header>

      <div class="page">
        <div class="messenger-panel">
          <div class="chat-header">
            <h1>Chats</h1>
          </div>

          <ul class="contact-list" id="contactList"></ul>
        </div>
      </div>
    </main>
  </div>

  <script>
    if (!sessionStorage.getItem('authUser') || sessionStorage.getItem('authRole') !== 'student') {
      window.location.href = 'index.html';
      throw new Error('Unauthorized access. Please log in first.');
    }

    const JOINED_KEY = 'student_joined_classes';
    const CHAT_KEY = 'class_chat_messages';

    const studentSidebar = document.getElementById('studentSidebar');
    const studentBurgerBtn = document.getElementById('studentBurgerBtn');
    const studentBackBtn = document.getElementById('studentBackBtn');
    const chatLogoutBtn = document.getElementById('chatLogoutBtn');
    const contactList = document.getElementById('contactList');

    document.querySelectorAll('.sidebar-link').forEach(link => {
      link.addEventListener('click', () => {
        document.querySelectorAll('.sidebar-link').forEach(item => item.classList.remove('active'));
        link.classList.add('active');
      });
    });

    function getJoinedClasses() {
      try {
        return JSON.parse(localStorage.getItem(JOINED_KEY)) || [];
      } catch {
        return [];
      }
    }

    function getChatMessages() {
      try {
        return JSON.parse(localStorage.getItem(CHAT_KEY)) || {};
      } catch {
        return {};
      }
    }

    function getInitials(name) {
      return (name || 'C')
        .split(' ')
        .map(part => part[0])
        .join('')
        .slice(0, 2)
        .toUpperCase();
    }

    if (chatLogoutBtn) {
      chatLogoutBtn.addEventListener('click', (event) => {
        event.preventDefault();
        sessionStorage.removeItem('authUser');
        sessionStorage.removeItem('authRole');
        window.location.href = 'index.html';
      });
    }

    studentBurgerBtn.addEventListener('click', function () {
      studentSidebar.classList.add('open');
    });

    studentBackBtn.addEventListener('click', function () {
      studentSidebar.classList.remove('open');
    });

    function renderContacts() {
      const joinedClasses = getJoinedClasses();

      if (!joinedClasses.length) {
        contactList.innerHTML = '<li class="empty-state">You are not in any class yet.</li>';
        return;
      }

      const chats = getChatMessages();

      contactList.innerHTML = joinedClasses.map(item => {
        const messages = chats[item.code] || [];
        const lastMessage = messages[messages.length - 1];

        return `
          <li>
            <a class="contact-item" href="student-chat-thread.html?name=${encodeURIComponent(item.name)}&code=${encodeURIComponent(item.code)}">
              <div class="contact-avatar">${getInitials(item.name)}</div>
              <div class="contact-main">
                <div class="contact-row">
                  <span class="contact-name">${item.name}</span>
                  <span class="contact-time">${lastMessage ? lastMessage.time : ''}</span>
                </div>
                <div class="contact-preview">${lastMessage ? lastMessage.text : 'No messages yet'}</div>
              </div>
            </a>
          </li>
        `;
      }).join('');
    }

    window.addEventListener('storage', function (event) {
      if (event.key === JOINED_KEY || event.key === CHAT_KEY) {
        renderContacts();
      }
    });

    renderContacts();
  </script>
</body>
</html>
